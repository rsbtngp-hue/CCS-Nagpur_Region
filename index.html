                                  </span>
                                </td>
                                <td className="py-3 px-2 text-right font-mono font-bold text-rose-300">
                                  -{calculatedDivisionTargets.summary.totMonthlyEnrolShortfall.toLocaleString()}
                                </td>
                                <td className="py-3 px-2 text-right font-mono font-bold text-rose-400 border-r border-slate-800">
                                  -{calculatedDivisionTargets.summary.totAnnualEnrolShortfall.toLocaleString()}
                                </td>
                              </>
                            ) : (
                              <>
                                <td className="py-3 px-2.5 text-right font-mono font-bold text-indigo-200">
                                  {targetViewPeriod === 'ANNUAL'
                                    ? calculatedDivisionTargets.summary.totAnnualEnrol.toLocaleString()
                                    : calculatedDivisionTargets.summary.totMonthlyEnrol.toLocaleString()}
                                </td>
                                <td className="py-3 px-2.5 text-right font-mono font-bold text-white">
                                  {calculatedDivisionTargets.summary.totActualEnrol.toLocaleString()}
                                </td>
                                <td className="py-3 px-2.5 text-center">
                                  <span className="px-2 py-0.5 rounded bg-indigo-900 text-indigo-100 text-[10px] font-bold">
                                    {targetViewPeriod === 'ANNUAL'
                                      ? ((calculatedDivisionTargets.summary.totActualEnrol / Math.max(1, calculatedDivisionTargets.summary.totAnnualEnrol)) * 100).toFixed(1)
                                      : ((calculatedDivisionTargets.summary.totActualEnrol / Math.max(1, calculatedDivisionTargets.summary.totMonthlyEnrol)) * 100).toFixed(1)}%
                                  </span>
                                </td>
                                <td className="py-3 px-2.5 text-right font-mono font-bold text-rose-300 border-r border-slate-800">
                                  -{targetViewPeriod === 'ANNUAL'
                                    ? calculatedDivisionTargets.summary.totAnnualEnrolShortfall.toLocaleString()
                                    : calculatedDivisionTargets.summary.totMonthlyEnrolShortfall.toLocaleString()}
                                </td>
                              </>
                            )
                          )}

                          {/* Region Updation Totals */}
                          {(targetMetricFilter === 'ALL' || targetMetricFilter === 'UPDATE') && (
                            targetViewPeriod === 'BOTH' ? (
                              <>
                                <td className="py-3 px-2 text-right font-mono font-bold text-amber-200">
                                  {calculatedDivisionTargets.summary.totMonthlyUpdate.toLocaleString()}
                                </td>
                                <td className="py-3 px-2 text-right font-mono font-bold text-amber-300">
                                  {calculatedDivisionTargets.summary.totAnnualUpdate.toLocaleString()}
                                </td>
                                <td className="py-3 px-2 text-right font-mono font-extrabold text-white">
                                  {calculatedDivisionTargets.summary.totActualUpdate.toLocaleString()}
                                </td>
                                <td className="py-3 px-2 text-center">
                                  <span className="px-1.5 py-0.5 rounded bg-amber-900 text-amber-100 text-[10px] font-bold">
                                    {((calculatedDivisionTargets.summary.totActualUpdate / Math.max(1, calculatedDivisionTargets.summary.totMonthlyUpdate)) * 100).toFixed(1)}%
                                  </span>
                                </td>
                                <td className="py-3 px-2 text-center">
                                  <span className="px-1.5 py-0.5 rounded bg-amber-950 text-amber-200 text-[10px] font-bold">
                                    {((calculatedDivisionTargets.summary.totActualUpdate / Math.max(1, calculatedDivisionTargets.summary.totAnnualUpdate)) * 100).toFixed(1)}%
                                  </span>
                                </td>
                                <td className="py-3 px-2 text-right font-mono font-bold text-rose-300">
                                  -{calculatedDivisionTargets.summary.totMonthlyUpdateShortfall.toLocaleString()}
                                </td>
                                <td className="py-3 px-2 text-right font-mono font-bold text-rose-400 border-r border-slate-800">
                                  -{calculatedDivisionTargets.summary.totAnnualUpdateShortfall.toLocaleString()}
                                </td>
                              </>
                            ) : (
                              <>
                                <td className="py-3 px-2.5 text-right font-mono font-bold text-amber-200">
                                  {targetViewPeriod === 'ANNUAL'
                                    ? calculatedDivisionTargets.summary.totAnnualUpdate.toLocaleString()
                                    : calculatedDivisionTargets.summary.totMonthlyUpdate.toLocaleString()}
                                </td>
                                <td className="py-3 px-2.5 text-right font-mono font-bold text-white">
                                  {calculatedDivisionTargets.summary.totActualUpdate.toLocaleString()}
                                </td>
                                <td className="py-3 px-2.5 text-center">
                                  <span className="px-2 py-0.5 rounded bg-amber-900 text-amber-100 text-[10px] font-bold">
                                    {targetViewPeriod === 'ANNUAL'
                                      ? ((calculatedDivisionTargets.summary.totActualUpdate / Math.max(1, calculatedDivisionTargets.summary.totAnnualUpdate)) * 100).toFixed(1)
                                      : ((calculatedDivisionTargets.summary.totActualUpdate / Math.max(1, calculatedDivisionTargets.summary.totMonthlyUpdate)) * 100).toFixed(1)}%
                                  </span>
                                </td>
                                <td className="py-3 px-2.5 text-right font-mono font-bold text-rose-300 border-r border-slate-800">
                                  -{targetViewPeriod === 'ANNUAL'
                                    ? calculatedDivisionTargets.summary.totAnnualUpdateShortfall.toLocaleString()
                                    : calculatedDivisionTargets.summary.totMonthlyUpdateShortfall.toLocaleString()}
                                </td>
                              </>
                            )
                          )}

                          {/* Region Grand Total Transactions */}
                          {targetMetricFilter === 'ALL' && (
                            targetViewPeriod === 'BOTH' ? (
                              <>
                                <td className="py-3 px-2 text-right font-mono font-extrabold text-amber-300">
                                  {calculatedDivisionTargets.summary.totMonthlyTrans.toLocaleString()}
                                </td>
                                <td className="py-3 px-2 text-right font-mono font-extrabold text-amber-200">
                                  {calculatedDivisionTargets.summary.totAnnualTrans.toLocaleString()}
                                </td>
                                <td className="py-3 px-2 text-right font-mono font-extrabold text-emerald-300">
                                  {calculatedDivisionTargets.summary.totActualTrans.toLocaleString()}
                                </td>
                                <td className="py-3 px-2 text-center">
                                  <span className="px-1.5 py-0.5 rounded bg-emerald-800 text-emerald-100 text-[10px] font-extrabold">
                                    {calculatedDivisionTargets.summary.totMonthlyAchievePct}%
                                  </span>
                                </td>
                                <td className="py-3 px-2 text-center">
                                  <span className="px-1.5 py-0.5 rounded bg-indigo-900 text-indigo-100 text-[10px] font-extrabold">
                                    {calculatedDivisionTargets.summary.totAnnualAchievePct}%
                                  </span>
                                </td>
                                <td className="py-3 px-2 text-right font-mono font-extrabold text-rose-300">
                                  -{calculatedDivisionTargets.summary.totMonthlyTotalShortfall.toLocaleString()}
                                </td>
                                <td className="py-3 px-2 text-right font-mono font-extrabold text-rose-400 border-r border-slate-800">
                                  -{calculatedDivisionTargets.summary.totAnnualTotalShortfall.toLocaleString()}
                                </td>
                              </>
                            ) : (
                              <>
                                <td className="py-3 px-2.5 text-right font-mono font-extrabold text-amber-300">
                                  {targetViewPeriod === 'ANNUAL'
                                    ? calculatedDivisionTargets.summary.totAnnualTrans.toLocaleString()
                                    : calculatedDivisionTargets.summary.totMonthlyTrans.toLocaleString()}
                                </td>
                                <td className="py-3 px-2.5 text-right font-mono font-extrabold text-emerald-300">
                                  {calculatedDivisionTargets.summary.totActualTrans.toLocaleString()}
                                </td>
                                <td className="py-3 px-2.5 text-center">
                                  <span className="px-2 py-0.5 rounded bg-emerald-800 text-emerald-100 text-[10px] font-extrabold">
                                    {targetViewPeriod === 'ANNUAL'
                                      ? calculatedDivisionTargets.summary.totAnnualAchievePct
                                      : calculatedDivisionTargets.summary.totMonthlyAchievePct}%
                                  </span>
                                </td>
                                <td className="py-3 px-2.5 text-right font-mono font-extrabold text-rose-300 border-r border-slate-800">
                                  -{targetViewPeriod === 'ANNUAL'
                                    ? calculatedDivisionTargets.summary.totAnnualTotalShortfall.toLocaleString()
                                    : calculatedDivisionTargets.summary.totMonthlyTotalShortfall.toLocaleString()}
                                </td>
                              </>
                            )
                          )}
                        </tr>
                      </tfoot>
                    </table>
                  </div>
                </div>
              )}
            </div>

            {/* SECTION 2.B: AADHAAR HIERARCHICAL CENTER BREAKDOWN (Division ➔ Sub Division ➔ Aadhaar Center) */}
            {(aadhaarSubView === 'ALL' || aadhaarSubView === 'HIERARCHY') && (
              <div className="space-y-4">
                {/* Delegated Filters & Action Bar */}
                <div className="bg-white rounded-xl border border-slate-200 p-4 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-3 bg-gradient-to-r from-indigo-50/70 via-white to-indigo-50/40">
                  <div className="flex items-center gap-3">
                    <div className="p-2.5 rounded-xl bg-indigo-600 text-white shadow-xs">
                      <Fingerprint className="w-5 h-5" />
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                        Aadhaar Centers - Hierarchical Operations Breakdown
                        <span className="text-[10px] font-semibold bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full">
                          Division ➔ Sub Division ➔ Aadhaar Center
                        </span>
                      </h3>
                      <p className="text-xs text-slate-500">
                        Expand divisions to inspect sub-divisions and individual Aadhaar centers with kit counts, counter transactions, MBU camps, and revenue.
                      </p>
                    </div>
                  </div>

                  {/* Delegated Filter Action Buttons */}
                  <div className="flex items-center gap-2 flex-wrap">
                    <button
                      onClick={expandAllAadhaar}
                      className="text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-indigo-200 bg-white hover:bg-indigo-50 text-indigo-700 transition-colors flex items-center gap-1 shadow-2xs"
                      title="Expand All Divisions & Sub Divisions"
                    >
                      <Maximize2 className="w-3.5 h-3.5" />
                      Expand All
                    </button>
                    <button
                      onClick={collapseAllAadhaar}
                      className="text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 transition-colors flex items-center gap-1 shadow-2xs"
                      title="Collapse All"
                    >
                      <Minimize2 className="w-3.5 h-3.5" />
                      Collapse All
                    </button>
                    <span className="text-xs font-bold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-lg border border-indigo-200">
                      Total Aadhaar Revenue: ₹{summaryMetrics.totalAadharRev.toLocaleString('en-IN')} (₹{(summaryMetrics.totalAadharRev / 10000000).toFixed(2)} Cr)
                    </span>
                  </div>
                </div>

                {/* Quick Metrics Bar for Active Aadhaar Filters */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                  <div className="bg-gradient-to-br from-blue-500/10 via-sky-50/70 to-white p-3 rounded-xl border border-sky-200 shadow-2xs flex items-center justify-between">
                    <div>
                      <span className="text-[11px] text-sky-900 font-bold block">Aadhaar Centres (Kits)</span>
                      <span className="text-lg font-extrabold text-sky-950">{summaryMetrics.aadharTotalCenters}</span>
                    </div>
                    <span className="text-[10px] font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded border border-emerald-300">
                      Active: {summaryMetrics.aadharActiveCenters}
                    </span>
                  </div>
                  <div className="bg-gradient-to-br from-purple-500/10 via-indigo-50/70 to-white p-3 rounded-xl border border-purple-200 shadow-2xs flex items-center justify-between">
                    <div>
                      <span className="text-[11px] text-purple-900 font-bold block">Counter Enrol / Upd</span>
                      <span className="text-lg font-extrabold text-purple-950">{summaryMetrics.counterTotal.toLocaleString()}</span>
                    </div>
                    <span className="text-[10px] font-bold text-purple-800 bg-purple-100 px-2 py-0.5 rounded border border-purple-300">
                      {summaryMetrics.counterEnrol} / {summaryMetrics.counterUpdate}
                    </span>
                  </div>
                  <div className="bg-gradient-to-br from-amber-500/10 via-orange-50/70 to-white p-3 rounded-xl border border-amber-200 shadow-2xs flex items-center justify-between">
                    <div>
                      <span className="text-[11px] text-amber-900 font-bold block">MBU Camps (Total Trans)</span>
                      <span className="text-lg font-extrabold text-amber-950">{summaryMetrics.mbuTotal.toLocaleString()}</span>
                    </div>
                    <span className="text-[10px] font-bold text-amber-800 bg-amber-100 px-2 py-0.5 rounded border border-amber-300">
                      {summaryMetrics.mbuCamps} Camps
                    </span>
                  </div>
                  <div className="bg-gradient-to-br from-emerald-500/10 via-teal-50/70 to-white p-3 rounded-xl border border-emerald-200 shadow-2xs flex items-center justify-between">
                    <div>
                      <span className="text-[11px] text-emerald-900 font-bold block">Total Aadhaar Fees</span>
                      <span className="text-lg font-extrabold text-emerald-800 font-mono">₹{(summaryMetrics.totalAadharRev / 10000000).toFixed(2)} Cr</span>
                    </div>
                    <span className="text-[10px] font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded border border-emerald-300">
                      ₹{summaryMetrics.totalAadharRev.toLocaleString('en-IN')}
                    </span>
                  </div>
                </div>

            {/* Hierarchical Expandable Tree Table */}
            <div className="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50 border-b border-slate-200 text-[11px] font-bold text-slate-600 uppercase tracking-wider">
                      <th className="py-3 px-4 min-w-[280px]">Division / Sub Division / Aadhaar Center</th>
                      <th className="py-3 px-3 text-center">Kits</th>
                      <th className="py-3 px-3 text-center">Status</th>
                      <th className="py-3 px-4 text-right">Counter Enrol / Upd</th>
                      <th className="py-3 px-4 text-right">Counter Total</th>
                      <th className="py-3 px-4 text-right">MBU Camps (Trans)</th>
                      <th className="py-3 px-4 text-right">Total Revenue (₹)</th>
                      <th className="py-3 px-3 text-center">Expand</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 text-xs">
                    {aadhaarHierarchy.length === 0 ? (
                      <tr>
                        <td colSpan={8} className="py-12 text-center text-slate-400">
                          No Aadhaar records found matching current delegated filter parameters.
                        </td>
                      </tr>
                    ) : (
                      aadhaarHierarchy.map((divItem) => {
                        const isDivExpanded = expandedAadhaarDivs.has(divItem.division);
                        return (
                          <React.Fragment key={`div-${divItem.division}`}>
                            {/* LEVEL 1: DIVISION ROW */}
                            <tr
                              onClick={() => toggleAadhaarDiv(divItem.division)}
                              className="bg-indigo-50/70 hover:bg-indigo-100/70 transition-colors cursor-pointer border-t border-indigo-100 font-semibold text-slate-900"
                            >
                              <td className="py-3 px-4">
                                <div className="flex items-center gap-2">
                                  {isDivExpanded ? (
                                    <ChevronDown className="w-4 h-4 text-indigo-600 shrink-0" />
                                  ) : (
                                    <ChevronRight className="w-4 h-4 text-slate-400 shrink-0" />
                                  )}
                                  <span className="text-sm font-bold text-indigo-950">{divItem.division}</span>
                                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-indigo-200/70 text-indigo-800 font-medium">
                                    {divItem.subDivList.length} SubDivs • {divItem.centers.size} Centers
                                  </span>
                                </div>
                              </td>
                              <td className="py-3 px-3 text-center font-mono font-bold text-indigo-900">
                                {divItem.kits} Kits
                              </td>
                              <td className="py-3 px-3 text-center">
                                <span className="text-[10px] px-2 py-0.5 rounded-full bg-indigo-100 text-indigo-700 font-semibold">
                                  Division Total
                                </span>
                              </td>
                              <td className="py-3 px-4 text-right font-mono text-slate-700">
                                {divItem.enrol} / {divItem.update}
                              </td>
                              <td className="py-3 px-4 text-right font-bold font-mono text-slate-900">
                                {divItem.totalTrans.toLocaleString()}
                              </td>
                              <td className="py-3 px-4 text-right font-mono text-slate-700">
                                {divItem.mbuCamps > 0 ? `${divItem.mbuCamps} camps (${divItem.mbuEnrol + divItem.mbuUpdate})` : '—'}
                              </td>
                              <td className="py-3 px-4 text-right font-bold font-mono text-indigo-900">
                                ₹{divItem.revenue.toLocaleString('en-IN')}
                              </td>
                              <td className="py-3 px-3 text-center">
                                <button className="text-indigo-600 hover:text-indigo-800 text-xs font-semibold">
                                  {isDivExpanded ? 'Hide' : 'Expand'}
                                </button>
                              </td>
                            </tr>

                            {/* LEVEL 2: SUB DIVISION ROWS */}
                            {isDivExpanded &&
                              divItem.subDivList.map((subItem) => {
                                const subKey = `${divItem.division}:::${subItem.subDivision}`;
                                const isSubExpanded = expandedAadhaarSubDivs.has(subKey);
                                return (
                                  <React.Fragment key={subKey}>
                                    <tr
                                      onClick={() => toggleAadhaarSubDiv(subKey)}
                                      className="bg-slate-50/90 hover:bg-slate-100 transition-colors cursor-pointer border-t border-slate-200/80 font-medium text-slate-800"
                                    >
                                      <td className="py-2.5 px-4 pl-9">
                                        <div className="flex items-center gap-2">
                                          {isSubExpanded ? (
                                            <ChevronDown className="w-3.5 h-3.5 text-indigo-600 shrink-0" />
                                          ) : (
                                            <ChevronRight className="w-3.5 h-3.5 text-slate-400 shrink-0" />
                                          )}
                                          <span className="font-semibold text-slate-800 text-xs">
                                            {subItem.subDivision}
                                          </span>
                                          <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-200/80 text-slate-600">
                                            {subItem.centerList.length} Centers ({subItem.kits} Kits)
                                          </span>
                                        </div>
                                      </td>
                                      <td className="py-2.5 px-3 text-center font-mono text-slate-600 text-[11px]">
                                        {subItem.kits}
                                      </td>
                                      <td className="py-2.5 px-3 text-center">
                                        <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-200 text-slate-700">
                                          Sub Division
                                        </span>
                                      </td>
                                      <td className="py-2.5 px-4 text-right font-mono text-slate-600">
                                        {subItem.enrol} / {subItem.update}
                                      </td>
                                      <td className="py-2.5 px-4 text-right font-semibold font-mono text-slate-800">
                                        {subItem.totalTrans.toLocaleString()}
                                      </td>
                                      <td className="py-2.5 px-4 text-right font-mono text-slate-600 text-[11px]">
                                        {subItem.mbuCamps > 0 ? `${subItem.mbuCamps} camps (${subItem.mbuEnrol + subItem.mbuUpdate})` : '—'}
                                      </td>
                                      <td className="py-2.5 px-4 text-right font-bold font-mono text-slate-800">
                                        ₹{subItem.revenue.toLocaleString('en-IN')}
                                      </td>
                                      <td className="py-2.5 px-3 text-center">
                                        <span className="text-[11px] text-indigo-600 font-medium">
                                          {isSubExpanded ? 'Collapse' : 'View'}
                                        </span>
                                      </td>
                                    </tr>

                                    {/* LEVEL 3: AADHAAR CENTER ROWS */}
                                    {isSubExpanded &&
                                      subItem.centerList.map((center) => {
                                        const centerKey = `${divItem.division}:::${subItem.subDivision}:::${center.officeName}`;
                                        const isCenterExpanded = expandedAadhaarCenters.has(centerKey);
                                        const isInactive = center.status.toLowerCase().includes('inactive');
                                        return (
                                          <React.Fragment key={centerKey}>
                                            <tr className="hover:bg-slate-50 transition-colors border-t border-slate-100 bg-white">
                                              <td className="py-2.5 px-4 pl-16">
                                                <div className="flex items-center gap-2">
                                                  <button
                                                    onClick={() => toggleAadhaarCenter(centerKey)}
                                                    className="text-slate-400 hover:text-indigo-600 p-0.5 rounded"
                                                    title="View daily date entries for this center"
                                                  >

                                <>
                                  <Check className="w-3.5 h-3.5" />
                                  <span>Yes</span>
                                </>
                              ) : (
                                <span>No</span>
                              )}
                            </button>
                          </td>

                          {/* Master Status Toggle */}
                          <td className="py-3 px-3 text-center whitespace-nowrap">
                            <button
                              onClick={() => handleToggleMasterFlag(off.name, 'status')}
                              className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold border transition-all ${
                                isActive
                                  ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100'
                                  : 'bg-rose-50 text-rose-700 border-rose-200 hover:bg-rose-100'
                              }`}
                              title="Click to toggle Active / Inactive status"
                            >
                              {isActive ? (
                                <>
                                  <CheckCircle className="w-3 h-3 text-emerald-600" />
                                  <span>Active</span>
                                </>
                              ) : (
                                <>
                                  <AlertCircle className="w-3 h-3 text-rose-600" />
                                  <span>Inactive</span>
                                </>
                              )}
                            </button>
                          </td>

                          {/* Action helper */}
                          <td className="py-3 px-4 text-center whitespace-nowrap">
                            <button
                              onClick={() => handleToggleMasterFlag(off.name, 'status')}
                              className="text-[11px] text-slate-500 hover:text-indigo-600 font-medium px-2 py-1 rounded hover:bg-indigo-50"
                            >
                              Toggle Status
                            </button>
                          </td>
                        </tr>
                      );
                    })
                  )}
                </tbody>
              </table>
            </div>

            <div className="p-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs text-slate-500">
              <span>Showing {filteredMasterOffices.length} of {regionalMasterOffices.length} master post offices in Nagpur Region</span>
              <span className="italic">Aadhaar Master: {summaryMetrics.aadharTotalCenters} Centres total ({regionalMasterOffices.filter(o => o.isAadhaar && o.kits === 2).length} with 2 kits)</span>
            </div>
          </div>
        )}

        {/* TAB 3: DETAILED RECORDS (CRUD + DRAG REORDER) */}
        {activeTab === 'records' && (
          <div className="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
            <div className="p-4 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-50/50">
              <div>
                <h3 className="text-sm font-bold text-slate-900 flex items-center gap-2">
                  <FileText className="w-4 h-4 text-indigo-600" />
                  Operational Data Records
                </h3>
                <p className="text-xs text-slate-500">
                  Drag row handles to reorder, click row chevrons to expand, or use Action buttons to edit/delete
                </p>
              </div>

              <div className="flex items-center gap-2">
                <span className="text-xs text-slate-500 font-medium">
                  Showing {(currentPage - 1) * rowsPerPage + 1} -{' '}
                  {Math.min(currentPage * rowsPerPage, filteredRows.length)} of{' '}
                  {filteredRows.length}
                </span>
              </div>
            </div>

            {/* Records Table with DnD */}
            <div className="overflow-x-auto">
              <DndContext
                sensors={sensors}
                collisionDetection={closestCenter}
                onDragEnd={handleDragEnd}
              >
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50 border-b border-slate-200 text-[11px] font-bold text-slate-600 uppercase tracking-wider">
                      <th className="py-3 px-3 w-10 text-center">Move</th>
                      <th className="py-3 px-3 w-10 text-center">Info</th>
                      <th className="py-3 px-4">Date</th>
                      <th className="py-3 px-4">Office Name & ID</th>
                      <th className="py-3 px-3 text-center">Type</th>
                      <th className="py-3 px-4">Division & SubDiv</th>
                      <th className="py-3 px-4 text-right">App @ ₹473</th>
                      <th className="py-3 px-4 text-right">PCC @ ₹120</th>
                      <th className="py-3 px-4 text-right">Revenue</th>
                      <th className="py-3 px-4 text-center">Actions</th>
                    </tr>
                  </thead>
                  <SortableContext
                    items={paginatedRows.map((d) => String(d.index_))}
                    strategy={verticalListSortingStrategy}
                  >
                    <tbody>
                      {paginatedRows.length === 0 ? (
                        <tr>
                          <td colSpan={10} className="py-14 text-center">
                            <div className="flex flex-col items-center gap-2 text-slate-400">
                              <FileText className="w-8 h-8 text-slate-300" />
                              <span className="text-xs font-medium">No records matching the selected criteria.</span>
                              <span className="text-[11px] text-slate-300">Try adjusting the filters or search above.</span>
                            </div>
                          </td>
                        </tr>
                      ) : (
                        paginatedRows.map((item) => (
                          <SortableTableRow
                            key={item.index_}
                            item={item}
                            colMap={colMap}
                            isExpanded={expandedRows.has(item.index_)}
                            onToggleExpand={toggleRowExpand}
                            onEdit={handleOpenEdit}
                            onDelete={(item) => setDeletingItem(item)}
                            isReadOnly={isReadOnly}
                          />
                        ))
                      )}
                    </tbody>
                  </SortableContext>
                </table>
              </DndContext>
            </div>

            {/* Pagination Controls */}
            {totalPages > 1 && (
              <div className="p-3 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2 bg-white text-xs">
                <button
                  disabled={currentPage === 1}
                  onClick={() => setCurrentPage((p) => Math.max(1, p - 1))}
                  aria-label="Previous page"
                  className="px-3 py-1.5 rounded border border-slate-200 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1 font-medium"
                >
                  <ChevronLeft className="w-3.5 h-3.5" />
                  Previous
                </button>
                <div className="flex items-center gap-1" role="navigation" aria-label="Pagination">
                  {getPageWindow(currentPage, totalPages).map((p, i) =>
                    p === '…' ? (
                      <span key={`ellipsis-${i}`} className="px-1.5 text-slate-400 select-none">
                        …
                      </span>
                    ) : (
                      <button
                        key={p}
                        onClick={() => setCurrentPage(p)}
                        aria-label={`Go to page ${p}`}
                        aria-current={currentPage === p ? 'page' : undefined}
                        className={`min-w-7 h-7 px-1 rounded text-xs font-semibold ${
                          currentPage === p
                            ? 'bg-indigo-600 text-white'
                            : 'text-slate-600 hover:bg-slate-100'
                        }`}
                      >
                        {p}
                      </button>
                    )
                  )}
                </div>
                <span className="text-slate-400 hidden sm:inline">
                  Page {currentPage} of {totalPages} • {filteredRows.length.toLocaleString('en-IN')} records
                </span>
                <button
                  disabled={currentPage === totalPages}
                  onClick={() => setCurrentPage((p) => Math.min(totalPages, p + 1))}
                  aria-label="Next page"
                  className="px-3 py-1.5 rounded border border-slate-200 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-1 font-medium"
                >
                  Next
                  <ChevronRight className="w-3.5 h-3.5" />
                </button>
              </div>
            )}
          </div>
        )}
      </main>

      {/* EDIT RECORD MODAL */}
      {editingItem && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-xs p-4 overflow-y-auto">
          <div className="bg-white rounded-xl shadow-xl border border-slate-200 max-w-lg w-full p-5 space-y-4 my-8">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div>
                <h3 className="text-base font-bold text-slate-900">
                  Edit Office Record
                </h3>
                <p className="text-xs text-slate-500">
                  Update operational transactions for Row #{editingItem.index_}
                </p>
              </div>
              <button
                type="button"
                onClick={() => setEditingItem(null)}
                aria-label="Close edit record dialog"
                className="text-slate-400 hover:text-slate-600 p-1 rounded hover:bg-slate-100 transition-colors"
              >
                <X className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSaveEdit} className="space-y-3.5 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">
                    Date (YYYY-MM-DD)
                  </label>
                  <input
                    type="text"
                    required
                    value={formData.date}
                    onChange={(e) =>
                      setFormData({ ...formData, date: e.target.value })
                    }
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">
                    Office ID
                  </label>
                  <input
                    type="text"
                    value={formData.officeId}
                    onChange={(e) =>
                      setFormData({ ...formData, officeId: e.target.value })
                    }
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">
                    Office Name
                  </label>
                  <input
                    type="text"
                    required
                    value={formData.officeName}
                    onChange={(e) =>
                      setFormData({ ...formData, officeName: e.target.value })
                    }
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">
                    Office Type
                  </label>
                  <select
                    value={formData.officeType}
                    onChange={(e) =>
                      setFormData({ ...formData, officeType: e.target.value })
                    }
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-indigo-500"
                  >
                    <option value="HPO">HPO (Head Post Office)</option>
                    <option value="SPO">SPO (Sub Post Office)</option>
                    <option value="GPO">GPO (General Post Office)</option>
                    <option value="BPC">BPC (Booking Counter)</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">
                    Division
                  </label>
                  <input
                    type="text"
                    value={formData.division}
                    onChange={(e) =>
                      setFormData({ ...formData, division: e.target.value })
                    }
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">
                    Sub Division
                  </label>
                  <input
                    type="text"
                    value={formData.subDiv}
                    onChange={(e) =>
                      setFormData({ ...formData, subDiv: e.target.value })
                    }
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
              </div>

              <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-3">
                <span className="font-bold text-slate-800 block text-xs">
                  Operational Metrics
                </span>
                <div className="grid grid-cols-3 gap-2">
                  <div>
                    <label className="block text-slate-600 mb-1">
                      App @ ₹473/-
                    </label>
                    <input
                      type="number"
                      min="0"
                      value={formData.app473}
                      onChange={(e) =>
                        setFormData({ ...formData, app473: e.target.value })
                      }
                      className="w-full bg-white border border-slate-300 rounded p-1.5 text-slate-800 font-semibold"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-600 mb-1">
                      PCC @ ₹120/-
                    </label>
                    <input
                      type="number"
                      min="0"
                      value={formData.pcc120}
                      onChange={(e) =>
                        setFormData({ ...formData, pcc120: e.target.value })
                      }
                      className="w-full bg-white border border-slate-300 rounded p-1.5 text-slate-800 font-semibold"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-600 mb-1">
                      Gangajal (@ ₹30)
                    </label>
                    <input
                      type="number"
                      min="0"
                      value={formData.gangajal}
                      onChange={(e) =>
                        setFormData({ ...formData, gangajal: e.target.value })
                      }
                      className="w-full bg-white border border-slate-300 rounded p-1.5 text-slate-800 font-semibold"
                    />
                  </div>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button
                  type="button"
                  onClick={() => setEditingItem(null)}
                  className="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50 font-medium"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold shadow-xs"
                >
                  Save Changes
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* ADD RECORD MODAL */}
      {isAddModalOpen && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-xs p-4 overflow-y-auto">
          <div className="bg-white rounded-xl shadow-xl border border-slate-200 max-w-lg w-full p-5 space-y-4 my-8">
            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
              <div>
                <h3 className="text-base font-bold text-slate-900">
                  Add Operational Record
                </h3>
                <p className="text-xs text-slate-500">
                  Append new post office report entry to the sheet
                </p>
              </div>
              <button
                type="button"
                onClick={() => setIsAddModalOpen(false)}
                aria-label="Close add record dialog"
                className="text-slate-400 hover:text-slate-600 p-1 rounded hover:bg-slate-100 transition-colors"
              >
                <X className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSaveAdd} className="space-y-3.5 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">
                    Date (YYYY-MM-DD)
                  </label>
                  <input
                    type="text"
                    required
                    placeholder="2026-08-31"
                    value={formData.date}
                    onChange={(e) =>
                      setFormData({ ...formData, date: e.target.value })
                    }
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">
                    Office ID
                  </label>
                  <input
                    type="text"
                    placeholder="e.g. 24360099"
                    value={formData.officeId}
                    onChange={(e) =>
                      setFormData({ ...formData, officeId: e.target.value })
                    }
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">
                    Office Name
                  </label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. Wardha H.O"
                    value={formData.officeName}
                    onChange={(e) =>
                      setFormData({ ...formData, officeName: e.target.value })
                    }
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">
                    Office Type
                  </label>
                  <select
                    value={formData.officeType}
                    onChange={(e) =>
                      setFormData({ ...formData, officeType: e.target.value })
                    }
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-indigo-500"
                  >
                    <option value="HPO">HPO (Head Post Office)</option>
                    <option value="SPO">SPO (Sub Post Office)</option>
                    <option value="GPO">GPO (General Post Office)</option>
                    <option value="BPC">BPC (Booking Counter)</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">
                    Division
                  </label>
                  <input
                    type="text"
                    placeholder="e.g. Wardha Division"
                    value={formData.division}
                    onChange={(e) =>
                      setFormData({ ...formData, division: e.target.value })
                    }
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">
                    Sub Division
                  </label>
                  <input
                    type="text"
                    placeholder="e.g. Wardha East Sub Div"
                    value={formData.subDiv}
                    onChange={(e) =>
                      setFormData({ ...formData, subDiv: e.target.value })
                    }
                    className="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-slate-800 focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
              </div>

              <div className="p-3 bg-slate-50 rounded-lg border border-slate-200 space-y-3">
                <span className="font-bold text-slate-800 block text-xs">
                  Operational Metrics
                </span>
                <div className="grid grid-cols-3 gap-2">
                  <div>
                    <label className="block text-slate-600 mb-1">
                      App @ ₹473/-
                    </label>
                    <input
                      type="number"
                      min="0"
                      value={formData.app473}
                      onChange={(e) =>
                        setFormData({ ...formData, app473: e.target.value })
                      }
                      className="w-full bg-white border border-slate-300 rounded p-1.5 text-slate-800 font-semibold"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-600 mb-1">
                      PCC @ ₹120/-
                    </label>
                    <input
                      type="number"
                      min="0"
                      value={formData.pcc120}
                      onChange={(e) =>
                        setFormData({ ...formData, pcc120: e.target.value })
                      }
                      className="w-full bg-white border border-slate-300 rounded p-1.5 text-slate-800 font-semibold"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-600 mb-1">
                      Gangajal (@ ₹30)
                    </label>
                    <input
                      type="number"
                      min="0"
                      value={formData.gangajal}
                      onChange={(e) =>
                        setFormData({ ...formData, gangajal: e.target.value })
                      }
                      className="w-full bg-white border border-slate-300 rounded p-1.5 text-slate-800 font-semibold"
                    />
                  </div>
                </div>
              </div>

              <div className="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button
                  type="button"
                  onClick={() => setIsAddModalOpen(false)}
                  className="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50 font-medium"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold shadow-xs"
                >
                  Insert Record
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* DELETE CONFIRMATION MODAL */}
      {deletingItem && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-xs p-4">
          <div className="bg-white rounded-xl shadow-xl border border-slate-200 max-w-sm w-full p-5 space-y-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-full bg-red-50 text-red-600 flex items-center justify-center shrink-0">
                <AlertCircle className="w-5 h-5" />
              </div>
              <div>
                <h3 className="text-sm font-bold text-slate-900">
                  Delete Record?
                </h3>
                <p className="text-xs text-slate-500">
                  Are you sure you want to remove Row #{deletingItem.index_} (
                  {deletingItem.row?.[colMap.officeName] || 'Record'})?
                </p>
              </div>
            </div>

            <div className="bg-slate-50 p-3 rounded-lg text-xs space-y-1 text-slate-600 border border-slate-100">
              <div>
                <span className="font-semibold">Date:</span>{' '}
                {formatDateSafe(deletingItem.row?.[colMap.date])}
              </div>
              <div>
                <span className="font-semibold">Division:</span>{' '}
                {deletingItem.row?.[colMap.division] || 'N/A'}
              </div>
            </div>

            <div className="flex justify-end gap-2">
              <button
                onClick={() => setDeletingItem(null)}
                className="px-3 py-1.5 border border-slate-300 rounded-lg text-xs font-medium text-slate-700 hover:bg-slate-50"
              >
                Cancel
              </button>
              <button
                onClick={handleConfirmDelete}
                className="px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-semibold shadow-xs"
              >
                Yes, Delete
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

return App;

</script>

<script type="module">
import React, { useState, useMemo, useRef, useEffect } from 'https://esm.sh/react@18.3.1';
import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
import * as Icons from 'https://esm.sh/lucide-react@0.468.0?deps=react@18.3.1';
import * as DndCore from 'https://esm.sh/@dnd-kit/core@6.1.0?deps=react@18.3.1';
import * as DndSortable from 'https://esm.sh/@dnd-kit/sortable@8.0.0?deps=react@18.3.1';
import * as DndUtilities from 'https://esm.sh/@dnd-kit/utilities@3.2.2?deps=react@18.3.1';
import * as d3 from 'https://esm.sh/d3@7.9.0';

const DATA_URL = 'https://script.google.com/macros/s/AKfycbzLvty_jqHrwi-zv5QW2YnKszQYbnFA-uNlvfH2OE3XdQQs6A0uZ2ObpBnh7kbl8T8h6Q/exec';
const REFRESH_MS = 30000;

function adaptSheetData(payload){
  let rows = payload;
  if (payload && !Array.isArray(payload)) {
    rows = payload.data || payload.values || payload.rows || [];
  }
  if (!Array.isArray(rows)) return [];
  return rows.map((row, index) => ({ row: Array.isArray(row) ? row : Object.values(row || {}), index_: index }));
}

function normalizeDateForFilters(v){
  const s=String(v ?? '').trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  let m=s.match(/^(\d{2})[-\/](\d{2})[-\/](\d{4})/);
  if(m) return `${m[3]}-${m[2]}-${m[1]}`;
  return s;
}

const iconNames = [
  'Building2','TrendingUp','IndianRupee','FileText','ShieldAlert','Search','Plus','Edit2','Trash2','X',
  'ChevronDown','ChevronUp','Calendar','Layers','BarChart3','Award','CheckCircle','AlertCircle','GripVertical',
  'ChevronLeft','ChevronRight','Filter','RefreshCw','Eye','Check','Fingerprint','Droplets','Maximize2','Minimize2','Target','Save'
];
const iconArgs = Object.fromEntries(iconNames.map(n => [n, Icons[n]]));

const source = document.getElementById('dashboard-source').textContent;
const compiled = Babel.transform(source, { presets: ['react'], parserOpts: { allowReturnOutsideFunction: true } }).code;
const factory = new Function(
  'React','useState','useMemo','useRef','useEffect','d3',
  'DndContext','closestCenter','PointerSensor','useSensor','useSensors',
  'SortableContext','verticalListSortingStrategy','useSortable','CSS',
  ...iconNames,
  compiled
);
const App = factory(
  React,useState,useMemo,useRef,useEffect,d3,
  DndCore.DndContext,DndCore.closestCenter,DndCore.PointerSensor,DndCore.useSensor,DndCore.useSensors,
  DndSortable.SortableContext,DndSortable.verticalListSortingStrategy,DndSortable.useSortable,DndUtilities.CSS,
  ...iconNames.map(n => iconArgs[n])
);

function DataShell(){
  const [data,setData]=useState([]);
  const [status,setStatus]=useState('connecting');
  const [error,setError]=useState('');
  const [lastSync,setLastSync]=useState(null);
  const [busy,setBusy]=useState(false);

  const loadData = async (manual=false) => {
    if (busy && manual) return;
    setBusy(true);
    setStatus('syncing');
    setError('');
    try{
      const url = DATA_URL + (DATA_URL.includes('?') ? '&' : '?') + '_ts=' + Date.now();
      const res = await fetch(url, { method:'GET', cache:'no-store', redirect:'follow' });
      if(!res.ok) throw new Error(`Google Apps Script returned HTTP ${res.status}`);
      const payload = await res.json();
      const adapted = adaptSheetData(payload);
      setData(adapted);
      setLastSync(new Date());
      setStatus('online');
    }catch(err){
      console.error(err);
      setStatus('error');
      setError(err?.message || 'Unable to connect to Google Sheet');
    }finally{ setBusy(false); }
  };

  useEffect(()=>{
    loadData();
    const timer=setInterval(()=>loadData(), REFRESH_MS);
    return ()=>clearInterval(timer);
  },[]);

  const statusText = status==='online' ? 'LIVE SYNC • Google Sheet connected' :
                     status==='syncing' ? 'SYNCING • Reading Google Sheet…' :
                     status==='error' ? 'SYNC ERROR • Check Apps Script deployment / access' :
                     'CONNECTING • Google Sheet data source';
  const statusClass = status==='online' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' :
                      status==='error' ? 'bg-red-50 text-red-700 border-red-200' :
                      'bg-amber-50 text-amber-700 border-amber-200';

  const readOnly = () => {
    setError('This dashboard is connected to Google Sheets as a live read-only data source. Add/Edit/Delete require a separate Apps Script write API.');
    setStatus('error');
    setTimeout(()=>setStatus(data.length ? 'online' : 'connecting'),5000);
  };

  const isFirstLoad = status !== 'error' && data.length === 0;

  // Full-page splash shown only until the very first successful sync (or a failure) completes.
  if (isFirstLoad) {
    return React.createElement('div', { className: 'syncbar min-h-screen flex items-center justify-center bg-slate-50 px-4' },
      React.createElement('div', { className: 'text-center max-w-sm' },
        React.createElement('div', { className: 'w-12 h-12 rounded-xl bg-indigo-600 mx-auto mb-4 flex items-center justify-center text-white shadow-sm animate-pulse' },
          React.createElement(Icons.Building2, { className: 'w-6 h-6' })
        ),
        React.createElement('div', { className: 'w-6 h-6 border-2 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-3' }),
        React.createElement('p', { className: 'text-sm font-semibold text-slate-700' }, 'Connecting to Google Sheet…'),
        React.createElement('p', { className: 'text-xs text-slate-400 mt-1' }, 'Loading the latest CCS performance records for the Nagpur Region.')
      )
    );
  }

  return React.createElement(React.Fragment,null,
    React.createElement('div',{className:'syncbar sticky top-0 z-[60] bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm'},
      React.createElement('div',{className:'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-2 flex flex-wrap items-center justify-between gap-2'},
        React.createElement('div',{className:`inline-flex items-center gap-2 px-3 py-1 rounded-full border text-xs font-semibold ${statusClass}`, role:'status'},
          React.createElement('span',{className:`w-2 h-2 rounded-full ${status==='online'?'bg-emerald-500':status==='error'?'bg-red-500':'bg-amber-500 animate-pulse'}`}),
          statusText
        ),
        React.createElement('div',{className:'flex items-center gap-3 text-xs text-slate-500'},
          React.createElement('span',null,`Records available: ${Math.max(0,data.length-1).toLocaleString('en-IN')}`),
          lastSync && React.createElement('span',{className:'hidden sm:inline'},`Last sync: ${lastSync.toLocaleTimeString('en-IN')}`),
          React.createElement('button',{onClick:()=>loadData(true),disabled:busy,'aria-label':'Refresh data from Google Sheet',className:'inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 font-medium disabled:opacity-50 transition-colors'},
            React.createElement(Icons.RefreshCw,{className:`w-3.5 h-3.5 ${busy?'animate-spin':''}`}), 'Refresh'
          )
        )
      ),
      error && React.createElement('div',{className:'max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-2 flex items-start justify-between gap-3 text-xs text-red-600'},
        React.createElement('span',null,error),
        React.createElement('button',{onClick:()=>setError(''),'aria-label':'Dismiss error message',className:'text-red-400 hover:text-red-600 shrink-0 font-bold leading-none px-1'},'✕')
      )
    ),
    React.createElement(App,{data,updateItem:readOnly,deleteItem:readOnly,insertItem:readOnly,moveItem:()=>{},followLink:()=>{},isReadOnly:true})
  );
}

// Basic error boundary so a rendering issue (e.g. an unexpected sheet shape) shows
// a recoverable message instead of a blank white page.
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { hasError: false }; }
  static getDerivedStateFromError() { return { hasError: true }; }
  componentDidCatch(err) { console.error('Dashboard render error:', err); }
  render() {
    if (this.state.hasError) {
      return React.createElement('div', { className: 'syncbar min-h-screen flex items-center justify-center bg-slate-50 px-4' },
        React.createElement('div', { className: 'text-center max-w-sm bg-white border border-red-100 rounded-xl p-6 shadow-sm' },
          React.createElement('p', { className: 'text-sm font-semibold text-red-700 mb-1' }, 'Something went wrong displaying the dashboard'),
          React.createElement('p', { className: 'text-xs text-slate-500 mb-4' }, 'This can happen if the connected Google Sheet\u2019s columns changed unexpectedly.'),
          React.createElement('button', {
            onClick: () => window.location.reload(),
            className: 'text-xs font-semibold px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white',
          }, 'Reload dashboard')
        )
      );
    }
    return this.props.children;
  }
}

createRoot(document.getElementById('root')).render(
  React.createElement(ErrorBoundary, null, React.createElement(DataShell))
);
</script>
</body>
