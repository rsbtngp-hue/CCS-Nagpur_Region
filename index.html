<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Live Citizen Centric Services (CCS) performance dashboard for the Nagpur Postal Region — Aadhaar, Gangajal and POPSK service tracking synced from Google Sheets." />
  <meta name="color-scheme" content="light" />
  <title>CCS Performance Dashboard - Google Sheets Live Sync</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html,body,#root{min-height:100%;margin:0}
    body{background:#f8fafc;-webkit-tap-highlight-color:transparent}
    .syncbar{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

    /* Slim, unobtrusive scrollbars for the horizontally-scrolling tables/tabs */
    .syncbar ::-webkit-scrollbar{height:8px;width:8px}
    .syncbar ::-webkit-scrollbar-track{background:transparent}
    .syncbar ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}
    .syncbar ::-webkit-scrollbar-thumb:hover{background:#94a3b8}
    .syncbar{scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}

    /* Keep keyboard focus visible without adding a ring on mouse clicks */
    .syncbar button:focus,.syncbar select:focus,.syncbar input:focus{outline:none}
    .syncbar button:focus-visible,.syncbar select:focus-visible,.syncbar input:focus-visible{
      outline:2px solid #6366f1;outline-offset:1px;
    }

    /* Smooth, deliberate tab-content transitions */
    .syncbar main{animation:fadeIn .15s ease-out}
    @keyframes fadeIn{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}

    /* Printable report: strip chrome and let tables/charts flow across pages */
    @media print{
      .syncbar > div:first-child, header, .no-print{display:none !important}
      body{background:#fff}
      main{padding:0 !important;max-width:none !important}
      section{break-inside:avoid;box-shadow:none !important;border:1px solid #e2e8f0 !important}
    }
  </style>
</head>
<body>
<div id="root"></div>

<!-- Existing dashboard source is compiled in the browser. Google Sheet is the only data source. -->
<script id="dashboard-source" type="text/plain">

function parseNum(val) {
  if (val === null || val === undefined || val === '') return 0;
  const cleaned = String(val).replace(/[^0-9.-]+/g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

// Builds a compact pagination window like [1, '…', 4, 5, 6, '…', 42]
function getPageWindow(current, total, siblings = 1) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  const pages = new Set([1, total, current]);
  for (let i = 1; i <= siblings; i++) {
    if (current - i > 1) pages.add(current - i);
    if (current + i < total) pages.add(current + i);
  }
  const sorted = Array.from(pages).sort((a, b) => a - b);
  const result = [];
  let prev = null;
  sorted.forEach((p) => {
    if (prev !== null && p - prev > 1) result.push('…');
    result.push(p);
    prev = p;
  });
  return result;
}

function formatDateSafe(str) {
  if (!str) return 'N/A';
  const s = String(str).trim();
  const parts = s.split('-');
  if (parts.length === 3) {
    const y = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10);
    const d = parseInt(parts[2], 10);
    if (!isNaN(y) && !isNaN(m) && !isNaN(d)) {
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('en-US', { day: '2-digit', month: 'short', year: 'numeric' });
    }
  }
  return s;
}

// Baseline Division Targets for 2026-27 as specified
const initialDivisionTargets = [
  { id: 1, division: 'Akola Division', annualEnrol: 7118, annualUpdate: 51880, monthlyEnrol: 593, monthlyUpdate: 4323 },
  { id: 2, division: 'Amaravati Division', annualEnrol: 6575, annualUpdate: 47890, monthlyEnrol: 548, monthlyUpdate: 3991 },
  { id: 3, division: 'Buldana Division', annualEnrol: 5480, annualUpdate: 39910, monthlyEnrol: 457, monthlyUpdate: 3325 },
  { id: 4, division: 'Chandrapur Division', annualEnrol: 4110, annualUpdate: 29933, monthlyEnrol: 343, monthlyUpdate: 2495 },
  { id: 5, division: 'Gadchiroli Division', annualEnrol: 4110, annualUpdate: 29932, monthlyEnrol: 342, monthlyUpdate: 2494 },
  { id: 6, division: 'Nagpur City Division', annualEnrol: 8220, annualUpdate: 59865, monthlyEnrol: 685, monthlyUpdate: 4989 },
  { id: 7, division: 'Nagpur Moffusil Division', annualEnrol: 8220, annualUpdate: 59865, monthlyEnrol: 685, monthlyUpdate: 4989 },
  { id: 8, division: 'Wardha Division', annualEnrol: 4380, annualUpdate: 31920, monthlyEnrol: 365, monthlyUpdate: 2660 },
  { id: 9, division: 'Yeotmal Division', annualEnrol: 6575, annualUpdate: 47890, monthlyEnrol: 548, monthlyUpdate: 3991 },
];

function SortableTableRow({
  item,
  colMap,
  isExpanded,
  onToggleExpand,
  onEdit,
  onDelete,
  isReadOnly = false,
}) {
  const {
    attributes,
    listeners,
    setNodeRef,
    transform,
    transition,
    isDragging,
  } = useSortable({ id: String(item.index_) });

  const style = {
    transform: CSS.Transform.toString(transform),
    transition,
    opacity: isDragging ? 0.4 : 1,
    position: 'relative',
    zIndex: isDragging ? 10 : 1,
  };

  const row = item.row || [];
  const dateVal = row[colMap.date];
  const officeName = row[colMap.officeName] || 'Unnamed Office';
  const officeId = row[colMap.officeId];
  const officeType = row[colMap.officeType] || 'N/A';
  const division = row[colMap.division] || 'N/A';
  const subDiv = row[colMap.subDiv] || 'N/A';
  const app473 = parseNum(row[colMap.app473]);
  const pcc120 = parseNum(row[colMap.pcc120]);
  const gangajal = parseNum(row[colMap.gangajal]);
  const aadharRev = parseNum(row[colMap.aadharRevenue]);
  const totalRev = (app473 * 473) + (pcc120 * 120) + (gangajal * 30) + aadharRev;

  const typeColor =
    officeType === 'HPO'
      ? 'bg-blue-50 text-blue-700 border-blue-200'
      : officeType === 'GPO'
      ? 'bg-purple-50 text-purple-700 border-purple-200'
      : officeType === 'SPO'
      ? 'bg-amber-50 text-amber-700 border-amber-200'
      : officeType === 'BPC'
      ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
      : 'bg-slate-50 text-slate-700 border-slate-200';

  return (
    <React.Fragment>
      <tr
        ref={setNodeRef}
        style={style}
        className={`border-b border-slate-100 hover:bg-slate-50/80 transition-colors ${
          isExpanded ? 'bg-indigo-50/20' : ''
        }`}
      >
        <td className="py-3 px-3 w-10 text-center">
          {isReadOnly ? (
            <span className="text-slate-200 p-1 inline-flex items-center rounded cursor-not-allowed" title="Reordering is disabled in read-only view">
              <GripVertical className="w-4 h-4" />
            </span>
          ) : (
            <button
              {...attributes}
              {...listeners}
              type="button"
              aria-label="Drag to reorder row"
              className="cursor-grab active:cursor-grabbing text-slate-300 hover:text-slate-600 p-1 inline-flex items-center rounded"
              title="Drag to reorder row"
            >
              <GripVertical className="w-4 h-4" />
            </button>
          )}
        </td>
        <td className="py-3 px-3 text-center w-10">
          <button
            type="button"
            onClick={() => onToggleExpand(item.index_)}
            aria-label={isExpanded ? 'Collapse row details' : 'Expand full details'}
            aria-expanded={isExpanded}
            className="text-slate-400 hover:text-slate-700 p-1 rounded hover:bg-slate-100 transition-colors"
            title={isExpanded ? 'Collapse row details' : 'Expand full details'}
          >
            {isExpanded ? (
              <ChevronUp className="w-4 h-4 text-indigo-600" />
            ) : (
              <ChevronDown className="w-4 h-4" />
            )}
          </button>
        </td>
        <td className="py-3 px-4 text-xs font-medium text-slate-700 whitespace-nowrap">
          {formatDateSafe(dateVal)}
        </td>
        <td className="py-3 px-4">
          <div className="font-semibold text-slate-900 text-sm flex items-center gap-1.5">
            {officeName}
          </div>
          <div className="text-xs text-slate-400 font-mono">
            {officeId ? `ID: ${officeId}` : ''}
          </div>
        </td>
        <td className="py-3 px-3 text-center whitespace-nowrap">
          <span className={`inline-flex px-2 py-0.5 text-xs font-semibold rounded-full border ${typeColor}`}>
            {officeType}
          </span>
        </td>
        <td className="py-3 px-4">
          <div className="text-xs font-medium text-slate-800">{division}</div>
          <div className="text-xs text-slate-400 truncate max-w-[140px]" title={subDiv}>
            {subDiv}
          </div>
        </td>
        <td className="py-3 px-4 text-right font-medium text-slate-900 text-sm">
          {app473 > 0 ? (
            <span className="font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-100">
              {app473.toLocaleString()}
            </span>
          ) : (
            <span className="text-slate-300">-</span>
          )}
        </td>
        <td className="py-3 px-4 text-right font-medium text-slate-900 text-sm">
          {pcc120 > 0 ? (
            <span className="font-semibold text-sky-700 bg-sky-50 px-2 py-0.5 rounded border border-sky-100">
              {pcc120.toLocaleString()}
            </span>
          ) : (
            <span className="text-slate-300">-</span>
          )}
        </td>
        <td className="py-3 px-4 text-right font-semibold text-slate-900 text-sm whitespace-nowrap">
          {totalRev > 0 ? `₹${Math.round(totalRev).toLocaleString('en-IN')}` : <span className="text-slate-300 font-normal">₹0</span>}
        </td>
        <td className="py-3 px-4 text-center whitespace-nowrap">
          <div className="flex items-center justify-center gap-1">
            <button
              type="button"
              onClick={() => onEdit(item)}
              disabled={isReadOnly}
              aria-label="Edit record"
              className={`p-1.5 rounded transition-colors ${
                isReadOnly
                  ? 'text-slate-200 cursor-not-allowed'
                  : 'text-slate-500 hover:text-indigo-600 hover:bg-indigo-50'
              }`}
              title={isReadOnly ? 'Editing is disabled in read-only view' : 'Edit record'}
            >
              <Edit2 className="w-3.5 h-3.5" />
            </button>
            <button
              type="button"
              onClick={() => onDelete(item)}
              disabled={isReadOnly}
              aria-label="Delete record"
              className={`p-1.5 rounded transition-colors ${
                isReadOnly
                  ? 'text-slate-200 cursor-not-allowed'
                  : 'text-slate-500 hover:text-red-600 hover:bg-red-50'
              }`}
              title={isReadOnly ? 'Deleting is disabled in read-only view' : 'Delete record'}
            >
              <Trash2 className="w-3.5 h-3.5" />
            </button>
          </div>
        </td>
      </tr>
      {isExpanded && (
        <tr className="bg-indigo-50/30 border-b border-slate-200">
          <td colSpan={10} className="p-4 sm:p-5">
            <div className="bg-white rounded-lg border border-indigo-100 p-4 shadow-xs">
              <div className="flex items-center justify-between border-b border-slate-100 pb-2.5 mb-3">
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold uppercase tracking-wider text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded">
                    Detailed Record Metrics
                  </span>
                  <span className="text-xs text-slate-500">Row Index: {item.index_}</span>
                </div>
                <div className="text-xs text-slate-500">
                  Station ID:{' '}
                  <span className="font-mono font-medium text-slate-700">
                    {row[colMap.stationId] || 'Not Assigned'}
                  </span>
                </div>
              </div>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                <div className="bg-slate-50 p-2.5 rounded border border-slate-100">
                  <span className="text-slate-500 block mb-0.5">App @ ₹473 Amount</span>
                  <span className="font-semibold text-slate-800 text-sm">
                    ₹{(app473 * 473).toLocaleString('en-IN')}
                  </span>
                </div>
                <div className="bg-slate-50 p-2.5 rounded border border-slate-100">
                  <span className="text-slate-500 block mb-0.5">PCC @ ₹120 Amount</span>
                  <span className="font-semibold text-slate-800 text-sm">
                    ₹{(pcc120 * 120).toLocaleString('en-IN')}
                  </span>
                </div>
                <div className="bg-slate-50 p-2.5 rounded border border-slate-100">
                  <span className="text-slate-500 block mb-0.5">Gangajal Sold (@ ₹30)</span>
                  <span className="font-semibold text-slate-800 text-sm">
                    {gangajal} (₹{(gangajal * 30).toLocaleString('en-IN')})
                  </span>
                </div>
                <div className="bg-slate-50 p-2.5 rounded border border-slate-100">
                  <span className="text-slate-500 block mb-0.5">Aadhar Station Kits</span>
                  <span className="font-semibold text-slate-800 text-sm">
                    {row[colMap.kits] !== null && row[colMap.kits] !== undefined
                      ? row[colMap.kits]
                      : '0'}
                  </span>
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-3 pt-3 border-t border-slate-100 text-xs">
                <div>
                  <span className="font-semibold text-slate-700 block mb-1">
                    Counter Transactions
                  </span>
                  <div className="text-slate-600 flex justify-between bg-slate-50 p-2 rounded">
                    <span>Enrolment / Updation:</span>
                    <span className="font-medium">
                      {parseNum(row[colMap.counterEnrol])} / {parseNum(row[colMap.counterUpdate])}
                    </span>
                  </div>
                </div>
                <div>
                  <span className="font-semibold text-slate-700 block mb-1">MBU Camps</span>
                  <div className="text-slate-600 flex justify-between bg-slate-50 p-2 rounded">
                    <span>Camps / Trans:</span>
                    <span className="font-medium">
                      {parseNum(row[colMap.mbuCamps])} Camps ({parseNum(row[colMap.mbuEnrol]) + parseNum(row[colMap.mbuUpdate])} trans)
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </td>
        </tr>
      )}
    </React.Fragment>
  );
}

function App({
  data = [],
  updateItem,
  deleteItem,
  insertItem,
  moveItem,
  followLink,
  isReadOnly = false,
}) {
  const [fromDate, setFromDate] = useState('');
  const [toDate, setToDate] = useState('');
  const [selectedMonth, setSelectedMonth] = useState('ALL');
  const [selectedDivision, setSelectedDivision] = useState('ALL');
  const [selectedSubDivision, setSelectedSubDivision] = useState('ALL');
  const [searchInput, setSearchInput] = useState('');
  const [searchQuery, setSearchQuery] = useState('');

  // Debounce the search box so filtering large record sets doesn't run on every keystroke
  useEffect(() => {
    const t = setTimeout(() => {
      setSearchQuery(searchInput);
      setCurrentPage(1);
    }, 250);
    return () => clearTimeout(t);
  }, [searchInput]);

  // Close whichever modal is open when the user presses Escape
  useEffect(() => {
    const onKeyDown = (e) => {
      if (e.key !== 'Escape') return;
      setIsAddModalOpen(false);
      setEditingItem(null);
      setDeletingItem(null);
    };
    window.addEventListener('keydown', onKeyDown);
    return () => window.removeEventListener('keydown', onKeyDown);
  }, []);
  const [activeTab, setActiveTab] = useState('overview'); // 'overview' | 'aadhaar' | 'gangajal' | 'popsk' | 'master' | 'targets' | 'records'
  const [masterAadhaarFilter, setMasterAadhaarFilter] = useState('ALL'); // 'ALL' | 'YES' | 'NO'
  const [divisionTargets, setDivisionTargets] = useState(initialDivisionTargets);
  const [isEditingTargets, setIsEditingTargets] = useState(false);
  const [targetViewPeriod, setTargetViewPeriod] = useState('MONTHLY'); // 'MONTHLY' | 'ANNUAL' | 'BOTH'
  const [targetMetricFilter, setTargetMetricFilter] = useState('ALL'); // 'ALL' | 'ENROL' | 'UPDATE'
  const [aadhaarSubView, setAadhaarSubView] = useState('ALL'); // 'ALL' | 'TARGETS' | 'HIERARCHY'
  const [expandedRows, setExpandedRows] = useState(new Set());
  const [currentPage, setCurrentPage] = useState(1);
  const rowsPerPage = 12;

  // Hierarchical Expand/Collapse state sets
  const [expandedAadhaarDivs, setExpandedAadhaarDivs] = useState(new Set());
  const [expandedAadhaarSubDivs, setExpandedAadhaarSubDivs] = useState(new Set());
  const [expandedAadhaarCenters, setExpandedAadhaarCenters] = useState(new Set());

  const [expandedGangajalDivs, setExpandedGangajalDivs] = useState(new Set());
  const [expandedGangajalSubDivs, setExpandedGangajalSubDivs] = useState(new Set());
  const [expandedGangajalCenters, setExpandedGangajalCenters] = useState(new Set());

  const [expandedPopskCenters, setExpandedPopskCenters] = useState(new Set());

  // Modals state
  const [isAddModalOpen, setIsAddModalOpen] = useState(false);
  const [editingItem, setEditingItem] = useState(null);
  const [deletingItem, setDeletingItem] = useState(null);

  // Form states for Add/Edit
  const [formData, setFormData] = useState({
    date: '',
    officeId: '',
    officeName: '',
    officeType: 'HPO',
    division: '',
    subDiv: '',
    app473: 0,
    pcc120: 0,
    gangajal: 0,
    kits: 1,
    activeStatus: 'Active',
    stationId: '',
    counterEnrol: 0,
    counterUpdate: 0,
    aadharRevenue: 0,
    mbuCamps: 0,
    mbuEnrol: 0,
    mbuUpdate: 0,
  });

  // Dynamic Column Mapping from header row
  const { headerIndex, headers, colMap, dataRows } = useMemo(() => {
    let hIdx = 1;
    let foundHeaders = [];

    for (let i = 0; i < Math.min(data.length, 5); i++) {
      const row = data[i]?.row || [];
      if (
        row.some(
          (c) =>
            typeof c === 'string' &&
            (/office_id/i.test(c) || /office name/i.test(c) || /^date$/i.test(c.trim()))
        )
      ) {
        hIdx = i;
        foundHeaders = row;
        break;
      }
    }

    if (foundHeaders.length === 0 && data[1]?.row) {
      hIdx = 1;
      foundHeaders = data[1].row;
    }

    const findCol = (regex, fallback) => {
      const idx = foundHeaders.findIndex((h) => regex.test(String(h || '')));
      return idx !== -1 ? idx : fallback;
    };

    const map = {
      date: findCol(/^date$/i, 0),
      officeId: findCol(/office_id/i, 1),
      officeName: findCol(/office\s*name/i, 2),
      officeType: findCol(/office-type|office\s*type/i, 3),
      division: findCol(/^division/i, 4),
      subDiv: findCol(/sub\s*division/i, 5),
      gangajal: findCol(/gangajal/i, 6),
      stationId: findCol(/station\s*id/i, 7),
      kits: findCol(/kits/i, 8),
      active: findCol(/active\/inactive/i, 9),
      inactiveReason: findCol(/inactive\s*reason/i, 10),
      counterEnrol: findCol(/enrolment.*excluding/i, 11),
      counterUpdate: findCol(/updation.*excluding/i, 12),
      counterTotal: findCol(/total\s*transactions/i, 13),
      aadharRevenue: findCol(/aadhar\s*revenue/i, 14),
      onlinePay: findCol(/online\s*payment/i, 15),
      mbuCamps: findCol(/mbu\s*camp\s*conducted/i, 16),
      mbuLocation: findCol(/mbu\s*camp\s*location/i, 17),
      mbuEnrol: findCol(/enrtollment|enrollment/i, 18),
      mbuUpdate: findCol(/updation.*camp|updation$/i, 19),
      mbuTotal: findCol(/total\s*transaction$/i, 20),
      app473: findCol(/473/i, 21),
      pcc120: findCol(/120/i, 22),
    };

    const rows = data.filter((d) => {
      if (d.index_ <= hIdx) return false;
      if (!d.row || !Array.isArray(d.row)) return false;
      return (
        d.row[map.officeName] !== undefined ||
        d.row[map.date] !== undefined ||
        d.row[map.officeId] !== undefined
      );
    });

    return {
      headerIndex: hIdx,
      headers: foundHeaders,
      colMap: map,
      dataRows: rows,
    };
  }, [data]);

  // Unique filter values derived dynamically from data
  const distinctDates = useMemo(() => {
    const set = new Set();
    dataRows.forEach((d) => {
      const v = d.row?.[colMap.date];
      if (v) set.add(String(v).trim());
    });
    return Array.from(set).sort();
  }, [dataRows, colMap.date]);

  const distinctDivisions = useMemo(() => {
    const set = new Set();
    dataRows.forEach((d) => {
      const v = d.row?.[colMap.division];
      if (v) set.add(String(v).trim());
    });
    return Array.from(set).sort();
  }, [dataRows, colMap.division]);

  const distinctMonths = useMemo(() => {
    const map = new Map();
    dataRows.forEach((d) => {
      const v = String(d.row?.[colMap.date] || '').trim();
      if (v) {
        const parts = v.split('-');
        if (parts.length >= 2) {
          const key = `${parts[0]}-${parts[1]}`;
          const y = parseInt(parts[0], 10);
          const m = parseInt(parts[1], 10);
          if (!isNaN(y) && !isNaN(m)) {
            const dateObj = new Date(y, m - 1, 1);
            const label = dateObj.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            map.set(key, label);
          }
        }
      }
    });
    return Array.from(map.entries()).sort((a, b) => a[0].localeCompare(b[0]));
  }, [dataRows, colMap.date]);

  const distinctSubDivisions = useMemo(() => {
    const set = new Set();
    dataRows.forEach((d) => {
      const div = String(d.row?.[colMap.division] || '').trim();
      const sub = String(d.row?.[colMap.subDiv] || '').trim();
      if (sub && (selectedDivision === 'ALL' || div === selectedDivision)) {
        set.add(sub);
      }
    });
    return Array.from(set).sort();
  }, [dataRows, colMap.subDiv, colMap.division, selectedDivision]);

  // Filtered dataset
  const filteredRows = useMemo(() => {
    return dataRows.filter((d) => {
      const r = d.row || [];
      const dVal = String(r[colMap.date] || '').trim();
      const divVal = String(r[colMap.division] || '').trim();
      const subDivVal = String(r[colMap.subDiv] || '').trim();
      const nameVal = String(r[colMap.officeName] || '').toLowerCase();
      const idVal = String(r[colMap.officeId] || '').toLowerCase();

      // Month filter
      if (selectedMonth !== 'ALL') {
        if (!dVal.startsWith(selectedMonth)) return false;
      }

      // From Date filter
      if (fromDate && dVal < fromDate) return false;

      // To Date filter

          return { ...off, status: off.status === 'Active' ? 'Inactive' : 'Active' };
        }
        if (flagKey === 'isAadhaar') {
          // Cycle: 2 Kits -> 1 Kit -> Inactive/No -> 2 Kits
          if (off.isAadhaar && off.kits === 2) {
            return { ...off, isAadhaar: true, kits: 1 };
          }
          if (off.isAadhaar && off.kits === 1) {
            return { ...off, isAadhaar: false, kits: 0 };
          }
          return { ...off, isAadhaar: true, kits: 2 };

    const masterAadhaarOffices = regionalMasterOffices.filter((o) => o.isAadhaar);
    const rawKitSum = masterAadhaarOffices.reduce((acc, o) => acc + (o.kits || 1), 0);
    const totalAllMasterKits = masterOffices.filter((o) => o.isAadhaar).reduce((acc, o) => acc + (o.kits || 1), 0);
    const isAllRegional = selectedDivision === 'ALL' && selectedSubDivision === 'ALL';
    const aadharTotalCenters = isAllRegional ? 248 : Math.round((rawKitSum / Math.max(1, totalAllMasterKits)) * 248);
    const aadharActiveRatio = masterAadhaarOffices.length > 0 
      ? masterAadhaarOffices.filter((o) => o.status === 'Active').length / masterAadhaarOffices.length 
      : 1;
    const aadharActiveCenters = Math.round(aadharTotalCenters * aadharActiveRatio);
    const aadharInactiveCenters = Math.max(0, aadharTotalCenters - aadharActiveCenters);
    const aadharReportingCount = masterAadhaarOffices.filter((o) => aadharReportingOffices.has(o.name)).length;

    const masterGangajalOffices = regionalMasterOffices.filter((o) => o.isGangajal);

    const gangajalReportedCount = masterGangajalOffices.filter((o) => gangajalReportedOffices.has(o.name)).length;

          division: div,
          subDivision: sub,
          totalBottles: 0,
          revenue: 0,
          records: [],
        });
      }

      const cObj = sObj.centers.get(office);
      const bottles = parseNum(r[colMap.gangajal]);
      const rev = bottles * 30;

      cObj.totalBottles += bottles;
      cObj.revenue += rev;
      cObj.records.push({ item, row: r, bottles, rev });

      sObj.totalBottles += bottles;
      sObj.revenue += rev;

      dObj.totalBottles += bottles;
      dObj.revenue += rev;
      dObj.centers.add(office);
    });

    return Array.from(divMap.values())
      .map((d) => ({
        ...d,
        subDivList: Array.from(d.subDivisions.values()).map((s) => ({
          ...s,
          centerList: Array.from(s.centers.values()),
        })),
      }))
      .sort((a, b) => b.totalBottles - a.totalBottles);
  }, [filteredRows, colMap]);

  // Aggregation STRICTLY for the 9 Designated Regional POPSK Centers
  const popskNineCentersData = useMemo(() => {
    const map = new Map();
    defaultPopskNames.forEach((centerName) => {
      map.set(centerName, {
        name: centerName,
        division: '',
        subDiv: '',
        officeType: 'HPO',
        officeId: '',
        app473: 0,
        rev473: 0,
        pcc120: 0,
        rev120: 0,
        totalRevenue: 0,
        records: [],
      });
    });

    masterOffices.forEach((o) => {
      if (map.has(o.name)) {
        const entry = map.get(o.name);
        entry.division = o.division;
        entry.subDiv = o.subDiv;
        entry.officeType = o.officeType;
        entry.officeId = o.id;
      }
    });

    filteredRows.forEach((item) => {
      const r = item.row || [];
      const name = String(r[colMap.officeName] || '').trim();
      if (map.has(name)) {
        const entry = map.get(name);
        if (!entry.division && r[colMap.division]) entry.division = r[colMap.division];
        if (!entry.subDiv && r[colMap.subDiv]) entry.subDiv = r[colMap.subDiv];
        if (!entry.officeId && r[colMap.officeId]) entry.officeId = r[colMap.officeId];
        if (!entry.officeType && r[colMap.officeType]) entry.officeType = r[colMap.officeType];

        const a = parseNum(r[colMap.app473]);
        const p = parseNum(r[colMap.pcc120]);
        const revA = a * 473;
        const revP = p * 120;
        const revTot = revA + revP;

        entry.app473 += a;
        entry.rev473 += revA;
        entry.pcc120 += p;
        entry.rev120 += revP;
        entry.totalRevenue += revTot;
        entry.records.push({
          item,
          row: r,
          date: r[colMap.date],
          app473: a,
          pcc120: p,
          revA,
          revP,
          revTot,
        });
      }
    });

    return Array.from(map.values()).sort((a, b) => b.totalRevenue - a.totalRevenue);
  }, [filteredRows, masterOffices, defaultPopskNames, colMap]);

  // Computed Summary Metrics exclusively for the 9 Designated POPSK Centers
  const popskNineSummary = useMemo(() => {
    let app473 = 0;
    let rev473 = 0;
    let pcc120 = 0;
    let rev120 = 0;
    let totalRevenue = 0;
    let activeCount = 0;

    popskNineCentersData.forEach((c) => {
      app473 += c.app473;
      rev473 += c.rev473;
      pcc120 += c.pcc120;
      rev120 += c.rev120;
      totalRevenue += c.totalRevenue;
      if (c.app473 > 0 || c.pcc120 > 0) {
        activeCount += 1;
      }
    });

    return {
      app473,
      rev473,
      pcc120,
      rev120,
      totalRevenue,
      activeCount,
    };
  }, [popskNineCentersData]);

  // Editable Division Targets handlers and computed sums
  const handleUpdateDivisionTarget = (divId, field, val) => {
    const num = Math.max(0, parseInt(val, 10) || 0);
    setDivisionTargets((prev) =>
      prev.map((row) => (row.id === divId ? { ...row, [field]: num } : row))
    );
  };

  const handleResetTargets = () => {
    setDivisionTargets(initialDivisionTargets);
  };

  const calculatedDivisionTargets = useMemo(() => {
    let totAnnualEnrol = 0;
    let totAnnualUpdate = 0;
    let totAnnualTrans = 0;
    let totMonthlyEnrol = 0;
    let totMonthlyUpdate = 0;
    let totMonthlyTrans = 0;
    let totActualEnrol = 0;
    let totActualUpdate = 0;
    let totActualTrans = 0;

    const rows = divisionTargets.map((d) => {
      const totalAnnual = Number(d.annualEnrol || 0) + Number(d.annualUpdate || 0);
      const totalMonthly = Number(d.monthlyEnrol || 0) + Number(d.monthlyUpdate || 0);

      totAnnualEnrol += Number(d.annualEnrol || 0);
      totAnnualUpdate += Number(d.annualUpdate || 0);
      totAnnualTrans += totalAnnual;
      totMonthlyEnrol += Number(d.monthlyEnrol || 0);
      totMonthlyUpdate += Number(d.monthlyUpdate || 0);
      totMonthlyTrans += totalMonthly;

      // Extract actual transactions achieved from dataset
      const match = aadhaarHierarchy.find(
        (h) => h.division.trim().toLowerCase() === d.division.trim().toLowerCase()
      );
      const actualEnrol = match ? match.enrol + match.mbuEnrol : 0;
      const actualUpdate = match ? match.update + match.mbuUpdate : 0;
      const actualTotal = actualEnrol + actualUpdate;
      totActualEnrol += actualEnrol;
      totActualUpdate += actualUpdate;
      totActualTrans += actualTotal;

      // Monthly Metrics & Shortfalls
      const monthlyEnrolAchievePct = d.monthlyEnrol > 0 ? ((actualEnrol / d.monthlyEnrol) * 100).toFixed(1) : '0';
      const monthlyEnrolShortfall = Math.max(0, d.monthlyEnrol - actualEnrol);
      const monthlyEnrolSurplus = Math.max(0, actualEnrol - d.monthlyEnrol);

      const monthlyUpdateAchievePct = d.monthlyUpdate > 0 ? ((actualUpdate / d.monthlyUpdate) * 100).toFixed(1) : '0';
      const monthlyUpdateShortfall = Math.max(0, d.monthlyUpdate - actualUpdate);
      const monthlyUpdateSurplus = Math.max(0, actualUpdate - d.monthlyUpdate);

      const monthlyTotalAchievePct = totalMonthly > 0 ? ((actualTotal / totalMonthly) * 100).toFixed(1) : '0';
      const monthlyTotalShortfall = Math.max(0, totalMonthly - actualTotal);
      const monthlyTotalSurplus = Math.max(0, actualTotal - totalMonthly);

      // Annual Metrics & Shortfalls
      const annualEnrolAchievePct = d.annualEnrol > 0 ? ((actualEnrol / d.annualEnrol) * 100).toFixed(1) : '0';
      const annualEnrolShortfall = Math.max(0, d.annualEnrol - actualEnrol);
      const annualEnrolSurplus = Math.max(0, actualEnrol - d.annualEnrol);

      const annualUpdateAchievePct = d.annualUpdate > 0 ? ((actualUpdate / d.annualUpdate) * 100).toFixed(1) : '0';
      const annualUpdateShortfall = Math.max(0, d.annualUpdate - actualUpdate);
      const annualUpdateSurplus = Math.max(0, actualUpdate - d.annualUpdate);

      const annualTotalAchievePct = totalAnnual > 0 ? ((actualTotal / totalAnnual) * 100).toFixed(1) : '0';
      const annualTotalShortfall = Math.max(0, totalAnnual - actualTotal);
      const annualTotalSurplus = Math.max(0, actualTotal - totalAnnual);

      return {
        ...d,
        totalAnnual,
        totalMonthly,
        actualEnrol,
        actualUpdate,
        actualTotal,
        // Monthly
        monthlyEnrolAchievePct,
        monthlyEnrolShortfall,
        monthlyEnrolSurplus,
        monthlyUpdateAchievePct,
        monthlyUpdateShortfall,
        monthlyUpdateSurplus,
        monthlyTotalAchievePct,
        monthlyTotalShortfall,
        monthlyTotalSurplus,
        // Annual
        annualEnrolAchievePct,
        annualEnrolShortfall,
        annualEnrolSurplus,
        annualUpdateAchievePct,
        annualUpdateShortfall,
        annualUpdateSurplus,
        annualTotalAchievePct,
        annualTotalShortfall,
        annualTotalSurplus,
      };
    });

    const totMonthlyEnrolShortfall = Math.max(0, totMonthlyEnrol - totActualEnrol);
    const totMonthlyUpdateShortfall = Math.max(0, totMonthlyUpdate - totActualUpdate);
    const totMonthlyTotalShortfall = Math.max(0, totMonthlyTrans - totActualTrans);

    const totAnnualEnrolShortfall = Math.max(0, totAnnualEnrol - totActualEnrol);
    const totAnnualUpdateShortfall = Math.max(0, totAnnualUpdate - totActualUpdate);
    const totAnnualTotalShortfall = Math.max(0, totAnnualTrans - totActualTrans);

    return {
      rows,
      summary: {
        totAnnualEnrol,
        totAnnualUpdate,
        totAnnualTrans,
        totMonthlyEnrol,
        totMonthlyUpdate,
        totMonthlyTrans,
        totActualEnrol,
        totActualUpdate,
        totActualTrans,
        totMonthlyEnrolShortfall,
        totMonthlyUpdateShortfall,
        totMonthlyTotalShortfall,
        totAnnualEnrolShortfall,
        totAnnualUpdateShortfall,
        totAnnualTotalShortfall,
        totMonthlyAchievePct: totMonthlyTrans > 0 ? ((totActualTrans / totMonthlyTrans) * 100).toFixed(1) : '0',
        totAnnualAchievePct: totAnnualTrans > 0 ? ((totActualTrans / totAnnualTrans) * 100).toFixed(1) : '0',
      },
    };
  }, [divisionTargets, aadhaarHierarchy]);

  // Expand / Collapse Helper Handlers
  const toggleAadhaarDiv = (div) => {
    setExpandedAadhaarDivs((prev) => {
      const next = new Set(prev);
      if (next.has(div)) next.delete(div);
      else next.add(div);
      return next;
    });
  };
  const toggleAadhaarSubDiv = (key) => {
    setExpandedAadhaarSubDivs((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  };
  const toggleAadhaarCenter = (key) => {
    setExpandedAadhaarCenters((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  };
  const expandAllAadhaar = () => {
    const allDivs = new Set();
    const allSubDivs = new Set();
    aadhaarHierarchy.forEach((d) => {
      allDivs.add(d.division);
      d.subDivList.forEach((s) => {
        allSubDivs.add(`${d.division}:::${s.subDivision}`);
      });
    });
    setExpandedAadhaarDivs(allDivs);
    setExpandedAadhaarSubDivs(allSubDivs);
  };
  const collapseAllAadhaar = () => {
    setExpandedAadhaarDivs(new Set());
    setExpandedAadhaarSubDivs(new Set());
    setExpandedAadhaarCenters(new Set());
  };

  const toggleGangajalDiv = (div) => {
    setExpandedGangajalDivs((prev) => {
      const next = new Set(prev);
      if (next.has(div)) next.delete(div);
      else next.add(div);
      return next;
    });
  };
  const toggleGangajalSubDiv = (key) => {
    setExpandedGangajalSubDivs((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  };
  const toggleGangajalCenter = (key) => {
    setExpandedGangajalCenters((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  };
  const expandAllGangajal = () => {
    const allDivs = new Set();
    const allSubDivs = new Set();
    gangajalHierarchy.forEach((d) => {
      allDivs.add(d.division);
      d.subDivList.forEach((s) => {
        allSubDivs.add(`${d.division}:::${s.subDivision}`);
      });
    });
    setExpandedGangajalDivs(allDivs);
    setExpandedGangajalSubDivs(allSubDivs);
  };
  const collapseAllGangajal = () => {
    setExpandedGangajalDivs(new Set());
    setExpandedGangajalSubDivs(new Set());
    setExpandedGangajalCenters(new Set());
  };

  const togglePopskCenter = (name) => {
    setExpandedPopskCenters((prev) => {
      const next = new Set(prev);
      if (next.has(name)) next.delete(name);
      else next.add(name);
      return next;
    });
  };

  // DnD Sensor Configuration
  const sensors = useSensors(
    useSensor(PointerSensor, {
      activationConstraint: {
        distance: 4,
      },
    })
  );

  const handleDragEnd = (event) => {
    const { active, over } = event;
    if (over && active.id !== over.id) {
      const fromIdx = parseInt(active.id, 10);
      const toIdx = parseInt(over.id, 10);
      if (!isNaN(fromIdx) && !isNaN(toIdx) && moveItem) {
        moveItem(fromIdx, toIdx);
      }
    }
  };

  // Pagination calculation
  const totalPages = Math.max(1, Math.ceil(filteredRows.length / rowsPerPage));
  const paginatedRows = useMemo(() => {
    const start = (currentPage - 1) * rowsPerPage;
    return filteredRows.slice(start, start + rowsPerPage);
  }, [filteredRows, currentPage, rowsPerPage]);

  const toggleRowExpand = (index_) => {
    setExpandedRows((prev) => {
      const next = new Set(prev);
      if (next.has(index_)) next.delete(index_);
      else next.add(index_);
      return next;
    });
  };

  // Open Edit Modal
  const handleOpenEdit = (item) => {
    const r = item.row || [];
    setEditingItem(item);
    setFormData({
      date: r[colMap.date] || '',
      officeId: r[colMap.officeId] || '',
      officeName: r[colMap.officeName] || '',
      officeType: r[colMap.officeType] || 'HPO',
      division: r[colMap.division] || '',
      subDiv: r[colMap.subDiv] || '',
      app473: parseNum(r[colMap.app473]),
      pcc120: parseNum(r[colMap.pcc120]),
      gangajal: parseNum(r[colMap.gangajal]),
      kits: r[colMap.kits] !== undefined ? r[colMap.kits] : 1,
      activeStatus: r[colMap.active] || 'Active',
      stationId: r[colMap.stationId] || '',
      counterEnrol: parseNum(r[colMap.counterEnrol]),
      counterUpdate: parseNum(r[colMap.counterUpdate]),
      aadharRevenue: parseNum(r[colMap.aadharRevenue]),
      mbuCamps: parseNum(r[colMap.mbuCamps]),
      mbuEnrol: parseNum(r[colMap.mbuEnrol]),
      mbuUpdate: parseNum(r[colMap.mbuUpdate]),
    });
  };

  // Open Add Modal
  const handleOpenAdd = () => {
    const defaultDate = distinctDates.length > 0 ? distinctDates[distinctDates.length - 1] : '';
    setFormData({
      date: defaultDate,
      officeId: '',
      officeName: '',
      officeType: 'HPO',
      division: distinctDivisions[0] || '',
      subDiv: '',
      app473: 0,
      pcc120: 0,
      gangajal: 0,
      kits: 1,
      activeStatus: 'Active',
      stationId: '',
      counterEnrol: 0,
      counterUpdate: 0,
      aadharRevenue: 0,
      mbuCamps: 0,
      mbuEnrol: 0,
      mbuUpdate: 0,
    });
    setIsAddModalOpen(true);
  };

  // Submit Save Edit
  const handleSaveEdit = (e) => {
    e.preventDefault();
    if (!editingItem) return;

    const rowLength = Math.max(headers.length, 23);
    const updatedRow = [...(editingItem.row || [])];
    while (updatedRow.length < rowLength) updatedRow.push(null);

    updatedRow[colMap.date] = formData.date;
    updatedRow[colMap.officeId] = formData.officeId;
    updatedRow[colMap.officeName] = formData.officeName;
    updatedRow[colMap.officeType] = formData.officeType;
    updatedRow[colMap.division] = formData.division;
    updatedRow[colMap.subDiv] = formData.subDiv;
    updatedRow[colMap.app473] = Number(formData.app473);
    updatedRow[colMap.pcc120] = Number(formData.pcc120);
    updatedRow[colMap.gangajal] = Number(formData.gangajal);
    updatedRow[colMap.kits] = Number(formData.kits);
    updatedRow[colMap.active] = formData.activeStatus;
    updatedRow[colMap.stationId] = formData.stationId;
    updatedRow[colMap.counterEnrol] = Number(formData.counterEnrol);
    updatedRow[colMap.counterUpdate] = Number(formData.counterUpdate);
    updatedRow[colMap.counterTotal] = Number(formData.counterEnrol) + Number(formData.counterUpdate);
    updatedRow[colMap.aadharRevenue] = Number(formData.aadharRevenue);
    updatedRow[colMap.mbuCamps] = Number(formData.mbuCamps);
    updatedRow[colMap.mbuEnrol] = Number(formData.mbuEnrol);
    updatedRow[colMap.mbuUpdate] = Number(formData.mbuUpdate);
    updatedRow[colMap.mbuTotal] = Number(formData.mbuEnrol) + Number(formData.mbuUpdate);

    if (updateItem) {
      updateItem(editingItem.index_, updatedRow);
    }
    setEditingItem(null);
  };

  // Submit Add New Item
  const handleSaveAdd = (e) => {
    e.preventDefault();
    const rowLength = Math.max(headers.length, 23);
    const newRow = new Array(rowLength).fill(null);

    newRow[colMap.date] = formData.date;
    newRow[colMap.officeId] = formData.officeId;
    newRow[colMap.officeName] = formData.officeName;
    newRow[colMap.officeType] = formData.officeType;
    newRow[colMap.division] = formData.division;
    newRow[colMap.subDiv] = formData.subDiv;
    newRow[colMap.app473] = Number(formData.app473);
    newRow[colMap.pcc120] = Number(formData.pcc120);
    newRow[colMap.gangajal] = Number(formData.gangajal);
    newRow[colMap.kits] = Number(formData.kits);
    newRow[colMap.active] = formData.activeStatus;
    newRow[colMap.stationId] = formData.stationId;
    newRow[colMap.counterEnrol] = Number(formData.counterEnrol);
    newRow[colMap.counterUpdate] = Number(formData.counterUpdate);
    newRow[colMap.counterTotal] = Number(formData.counterEnrol) + Number(formData.counterUpdate);
    newRow[colMap.aadharRevenue] = Number(formData.aadharRevenue);
    newRow[colMap.mbuCamps] = Number(formData.mbuCamps);
    newRow[colMap.mbuEnrol] = Number(formData.mbuEnrol);
    newRow[colMap.mbuUpdate] = Number(formData.mbuUpdate);
    newRow[colMap.mbuTotal] = Number(formData.mbuEnrol) + Number(formData.mbuUpdate);

    if (insertItem) {
      insertItem(undefined, newRow);
    }
    setIsAddModalOpen(false);
  };

  // Confirm Delete
  const handleConfirmDelete = () => {
    if (deletingItem && deleteItem) {
      deleteItem(deletingItem.index_);
      setDeletingItem(null);
    }
  };

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans selection:bg-indigo-100 selection:text-indigo-900">
      {/* Top Navigation / App Bar */}
      <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between py-3.5 gap-3">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-700 flex items-center justify-center text-white shadow-sm ring-2 ring-indigo-50">
                <Building2 className="w-5 h-5" />
              </div>
              <div>
                <h1 className="text-lg sm:text-xl font-bold text-slate-900 leading-tight flex items-center gap-2">
                  Citizen Centric Services (CCS) Performance Dashboard - Nagpur Region
                  <span className="text-xs px-2 py-0.5 font-medium rounded-full bg-indigo-50 text-indigo-700 border border-indigo-100 hidden sm:inline-flex">
                    Nagpur Region
                  </span>
                </h1>
                <p className="text-xs text-slate-500">
                  Daily Citizen Services & Revenue Performance Monitoring
                </p>
              </div>
            </div>

            {/* Top Right Action Buttons */}
            <div className="flex items-center gap-2 self-end sm:self-auto">
              {isReadOnly && (
                <span
                  className="hidden sm:inline-flex items-center gap-1 text-[11px] font-medium text-slate-500 bg-slate-100 border border-slate-200 px-2 py-1 rounded-md"
                  title="This dashboard reads live from Google Sheets. Writing back requires a separate Apps Script write API."
                >
                  <Eye className="w-3 h-3" />
                  View only
                </span>
              )}
              <button
                onClick={handleOpenAdd}
                disabled={isReadOnly}
                title={isReadOnly ? 'Read-only live view — adding records requires a write API' : 'Add a new record'}
                aria-disabled={isReadOnly}
                className={`inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold rounded-lg shadow-xs transition-colors ${
                  isReadOnly
                    ? 'bg-slate-100 text-slate-400 cursor-not-allowed border border-slate-200'
                    : 'bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white'
                }`}
              >
                <Plus className="w-4 h-4" />
                <span>Add Record</span>
              </button>
            </div>
          </div>

          {/* Navigation Tabs */}
          <div className="flex border-t border-slate-100 -mb-px space-x-1 sm:space-x-3 overflow-x-auto">
            <button
              onClick={() => { setActiveTab('overview'); setCurrentPage(1); }}
              className={`py-2.5 px-2.5 text-xs font-semibold border-b-2 flex items-center gap-1.5 whitespace-nowrap transition-colors ${
                activeTab === 'overview'
                  ? 'border-indigo-600 text-indigo-700'
                  : 'border-transparent text-slate-500 hover:text-slate-800'
              }`}
            >
              <BarChart3 className="w-3.5 h-3.5" />
              Executive Overview
            </button>

            {/* Main Header Sections: Aadhaar (with Targets vs Achievement) • Gangajal • POPSK Detail Data */}
            <button
              onClick={() => { setActiveTab('aadhaar'); setCurrentPage(1); }}
              className={`py-2.5 px-2.5 text-xs font-semibold border-b-2 flex items-center gap-1.5 whitespace-nowrap transition-colors ${
                activeTab === 'aadhaar' || activeTab === 'targets'
                  ? 'border-indigo-600 text-indigo-700 bg-indigo-50/50 rounded-t'
                  : 'border-transparent text-slate-600 hover:text-indigo-700'
              }`}
            >
              <Fingerprint className="w-3.5 h-3.5 text-indigo-600" />
              Aadhaar Details & Division Targets
            </button>

            <button
              onClick={() => { setActiveTab('gangajal'); setCurrentPage(1); }}
              className={`py-2.5 px-2.5 text-xs font-semibold border-b-2 flex items-center gap-1.5 whitespace-nowrap transition-colors ${
                activeTab === 'gangajal'
                  ? 'border-sky-600 text-sky-700 bg-sky-50/50 rounded-t'
                  : 'border-transparent text-slate-600 hover:text-sky-700'

            >
              <Droplets className="w-3.5 h-3.5 text-sky-600" />

            </button>

            <button

                                          parseFloat(achvTotalPct) >= 100
                                            ? 'bg-emerald-100 text-emerald-900 border-emerald-400'
                                            : parseFloat(achvTotalPct) >= 50
                                            ? 'bg-amber-100 text-amber-900 border-amber-400'
                                            : 'bg-rose-100 text-rose-900 border-rose-400'
                                        }`}
                                      >
                                        {achvTotalPct}%
                                      </span>
                                    </td>
                                    <td className="py-2 px-2.5 text-right bg-emerald-50/30 font-mono border-r border-emerald-200">
                                      {sfallTotal > 0 ? (
                                        <span className="font-extrabold text-rose-700 bg-rose-100 px-2 py-0.5 rounded border border-rose-200">
                                          -{sfallTotal.toLocaleString()}
                                        </span>
                                      ) : (
                                        <span className="text-emerald-800 font-extrabold bg-emerald-100 px-2 py-0.5 rounded border border-emerald-200 text-[10px]">
                                          Surplus +{Math.abs(row.actualTotal - tgtTotal).toLocaleString()}
                                        </span>
                                      )}
                                    </td>
                                  </>
                                )
                              )}
                            </tr>
                          );
                        })}
                      </tbody>

                      {/* GRAND TOTAL ROW: NAGPUR REGION */}
                      <tfoot>
                        <tr className="bg-slate-900 text-white font-bold text-xs border-t-2 border-slate-900">

                          <td className="py-3 px-4 uppercase tracking-wider font-extrabold text-amber-300 border-r border-slate-800 whitespace-nowrap">

                          </td>

                          {/* Region Enrolment Totals */}
                          {(targetMetricFilter === 'ALL' || targetMetricFilter === 'ENROL') && (
                            targetViewPeriod === 'BOTH' ? (
                              <>
                                <td className="py-3 px-2 text-right font-mono font-bold text-indigo-200">
                                  {calculatedDivisionTargets.summary.totMonthlyEnrol.toLocaleString()}
                                </td>
                                <td className="py-3 px-2 text-right font-mono font-bold text-indigo-300">
                                  {calculatedDivisionTargets.summary.totAnnualEnrol.toLocaleString()}
                                </td>
                                <td className="py-3 px-2 text-right font-mono font-extrabold text-white">
                                  {calculatedDivisionTargets.summary.totActualEnrol.toLocaleString()}
                                </td>
                                <td className="py-3 px-2 text-center">
                                  <span className="px-1.5 py-0.5 rounded bg-indigo-900 text-indigo-100 text-[10px] font-bold">
                                    {((calculatedDivisionTargets.summary.totActualEnrol / Math.max(1, calculatedDivisionTargets.summary.totMonthlyEnrol)) * 100).toFixed(1)}%
                                  </span>
                                </td>
                                <td className="py-3 px-2 text-center">
                                  <span className="px-1.5 py-0.5 rounded bg-indigo-950 text-indigo-200 text-[10px] font-bold">
